<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="nebula" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="40%" stop-color="#0a0a1e"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="titleFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#888888" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="816" height="1200" fill="url(#nebula)"/>
  <rect width="816" height="1200" fill="url(#glow)"/>
  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="200" r="1.5"/>
    <circle cx="300" cy="150" r="1"/>
    <circle cx="500" cy="100" r="2"/>
    <circle cx="700" cy="250" r="1"/>
    <circle cx="200" cy="400" r="1.5"/>
    <circle cx="600" cy="350" r="1"/>
    <circle cx="150" cy="600" r="1"/>
    <circle cx="650" cy="500" r="1.5"/>
    <circle cx="400" cy="550" r="1"/>
    <circle cx="100" cy="800" r="1"/>
    <circle cx="700" cy="700" r="1.5"/>
    <circle cx="350" cy="750" r="1"/>
  </g>
  <!-- Title -->
  <text x="408" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="url(#titleFade)" letter-spacing="-2">NEBULA</text>
  <text x="408" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="url(#titleFade)" letter-spacing="-2">CASCADE</text>
  <!-- Filmmaker -->
  <text x="408" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ef4444" opacity="0.8" letter-spacing="6">A FILM BY ENRIQUE CATALAN</text>
  <!-- Tagline -->
  <text x="408" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" opacity="0.7" letter-spacing="2">A quiet collision of memory, light, and the endless sky.</text>
  <!-- Coming soon -->
  <text x="408" y="1100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b" letter-spacing="8">COMING SOON</text>
</svg>
